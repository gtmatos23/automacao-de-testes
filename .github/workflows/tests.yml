name: Test Automation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      BASE_URL: "https://www.saucedemo.com/"

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2  # ou a tag mais recente v4/v5 do repositório oficial

      - name: Setup Python
        uses: actions/setup-python@v5.4.0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Linter (Flake8)
        run: |
          flake8 tests/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run PyTest with Allure & HTML Reports
        run: |
          mkdir -p reports/screenshots
          python -m pytest tests/specs \
            --html=reports/report.html \
            --junitxml=reports/results.xml \
            --alluredir=allure-results \
            --self-contained-html

      - name: Install Allure CLI
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -zxvf allure-2.24.0.tgz
          sudo mv allure-2.24.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate Allure HTML Report
        if: always()
        run: |
          allure generate allure-results --clean -o reports/allure-report

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports
          path: reports/