name: Test Automation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      BASE_URL: "https://www.saucedemo.com/"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Linter (Flake8)
        run: |
          flake8 tests/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run PyTest with Allure & HTML Reports
        run: |
          mkdir -p reports/screenshots
          python -m pytest tests/specs \
            --html=reports/report.html \
            --junitxml=reports/results.xml \
            --alluredir=allure-results \
            --self-contained-html

      - name: Generate Allure Report
        uses: mgrybyk/allure-report-branch@v1.6.2
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports
          path: |
            reports/
            allure-report/
            allure-results/